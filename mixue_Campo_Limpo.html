<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E3000B">
<title>Mixue · Inspeção</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--red:#E3000B;--bg:#F5F5F5;--txt:#111;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);min-height:100vh;max-width:480px;margin:0 auto;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}

/* ── INDEX ── */
.index-view{min-height:100vh;display:flex;flex-direction:column;}
.index-header{background:var(--red);padding:32px 24px 28px;text-align:center;}
.index-store{color:#fff;font-size:22px;font-weight:900;letter-spacing:.5px;margin-bottom:6px;}
.index-date{color:rgba(255,255,255,.85);font-size:15px;}
.index-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;gap:18px;}
.index-label{color:#aaa;font-size:13px;text-align:center;margin-bottom:6px;}
.btn-index{width:100%;padding:22px 0;border-radius:16px;background:var(--red);color:#fff;font-size:19px;font-weight:900;letter-spacing:.3px;box-shadow:0 4px 18px rgba(227,0,11,.25);transition:opacity .15s;}
.btn-index:active{opacity:.85;}
.btn-index-sub{font-size:12px;font-weight:400;color:rgba(255,255,255,.75);margin-top:4px;}
.index-footer{padding:20px;text-align:center;color:#ccc;font-size:11px;}
.index-king{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;min-height:140px;}
.index-king img{max-height:250px;max-width:325px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.12));}

/* ── SHARED INSPECTION ── */
.header{background:var(--red);padding:14px 18px;display:flex;align-items:center;position:sticky;top:0;z-index:10;}
.header-title{color:#fff;font-weight:900;font-size:16px;line-height:1.1;}
.header-sub{color:rgba(255,255,255,.8);font-size:10px;}
.header-badge{margin-left:auto;background:rgba(0,0,0,.2);border-radius:20px;padding:5px 13px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap;}
.btn-back-header{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:10px;padding:6px 12px;font-size:12px;font-weight:700;margin-right:10px;cursor:pointer;}
.progress-bar{height:3px;background:#ddd;}
.progress-fill{height:100%;background:var(--red);transition:width .3s ease;}
.step-counter{padding:6px 18px 2px;display:flex;justify-content:space-between;}
.step-counter span{color:#aaa;font-size:12px;}
.step-counter span b{color:var(--red);}
.dots{display:flex;gap:4px;padding:6px 14px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.dots::-webkit-scrollbar{display:none;}
.dot{min-width:26px;height:26px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;color:#888;background:#ddd;border:none;}
.dot.active{background:var(--red);color:#fff;border:2px solid #aaa;}
.dot.done{background:#b80009;color:#fff;}
.dot.partial{background:#e06060;color:#fff;}
.main{padding:10px 18px 24px;display:flex;flex-direction:column;min-height:calc(100vh - 130px);}
.step-name{text-align:center;margin-bottom:12px;}
.step-pt{font-size:22px;font-weight:900;color:var(--txt);line-height:1.2;}
.step-zh{font-size:14px;color:#aaa;margin-top:4px;letter-spacing:1px;}
.step-badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 10px;margin-top:6px;}
.photo-single{flex:1;min-height:250px;border-radius:14px;border:2px dashed #ccc;background:#e8e8e8;cursor:pointer;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.photo-single.has-photo{border-color:var(--red);background:#000;}
.photo-grid{display:grid;gap:8px;flex:1;margin-bottom:16px;}
.photo-grid.g2{grid-template-columns:1fr 1fr;}
.photo-grid.g3{grid-template-columns:1fr 1fr 1fr;}
.photo-grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.photo-grid.g5{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;}
.photo-slot{min-height:120px;border-radius:12px;border:2px dashed #ccc;background:#e8e8e8;cursor:pointer;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;}
.photo-slot.has-photo{border-color:var(--red);background:#000;}
.photo-slot img,.photo-single img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:block;}
.photo-empty{text-align:center;padding:10px;pointer-events:none;}
.photo-empty .icon{font-size:32px;}
.photo-empty .lbl{color:#aaa;font-size:11px;margin-top:4px;}
.photo-empty .sub{color:#bbb;font-size:9px;margin-top:2px;}
.swap-btn{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.65);border-radius:10px;padding:3px 8px;color:#fff;font-size:10px;}
.slot-num{position:absolute;top:5px;left:5px;background:var(--red);border-radius:8px;padding:2px 7px;color:#fff;font-size:10px;font-weight:700;}
.nav{display:flex;gap:10px;}
.btn-prev{width:52px;height:52px;border-radius:12px;background:#e0e0e0;color:var(--txt);font-size:20px;display:flex;align-items:center;justify-content:center;}
.btn-prev.disabled{background:#ebebeb;color:#ccc;cursor:default;}
.btn-next{flex:1;height:52px;border-radius:12px;background:var(--red);color:#fff;font-size:15px;font-weight:700;}
.pending-note{color:#c07000;font-size:12px;text-align:center;margin-top:10px;}
.mosaic-view{display:flex;flex-direction:column;min-height:100vh;}
.mosaic-body{padding:18px 16px;flex:1;}
.mosaic-img{width:100%;border-radius:10px;border:2px solid var(--red);display:block;margin-bottom:18px;}
.mosaic-btns{display:flex;gap:10px;margin-bottom:10px;}
.btn-share{flex:1;background:var(--red);color:#fff;border:none;border-radius:12px;padding:15px 0;font-size:15px;font-weight:700;}
.btn-download{flex:1;background:#fff;color:var(--txt);border:1.5px solid var(--red);border-radius:12px;padding:15px 0;font-size:15px;font-weight:700;}
.btn-download-full{width:100%;background:var(--red);color:#fff;border:none;border-radius:12px;padding:18px 0;font-size:16px;font-weight:700;}
.btn-reset-mosaic{width:100%;background:transparent;color:#aaa;border:1px solid #ddd;border-radius:12px;padding:13px 0;font-size:14px;margin-bottom:8px;}
.btn-home{width:100%;background:transparent;color:var(--red);border:1.5px solid var(--red);border-radius:12px;padding:13px 0;font-size:14px;font-weight:700;}
.gen-view{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;}
.spinner{width:48px;height:48px;border:4px solid #ddd;border-top:4px solid var(--red);border-radius:50%;animation:spin .8s linear infinite;}
.gen-text{color:#888;font-size:15px;}
@keyframes spin{to{transform:rotate(360deg);}}
/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-card{background:#fff;border-radius:18px;border:1px solid #ddd;padding:28px 24px 20px;max-width:320px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal-icon{font-size:36px;margin-bottom:12px;}
.modal-msg{font-size:16px;font-weight:700;color:#111;margin-bottom:6px;line-height:1.4;}
.modal-sub{font-size:13px;color:#888;margin-bottom:22px;}
.modal-btns{display:flex;gap:10px;}
.modal-btn-no{flex:1;padding:13px 0;border-radius:12px;background:#fff;color:#555;border:1.5px solid #ccc;font-size:15px;font-weight:700;cursor:pointer;}
.modal-btn-yes{flex:1;padding:13px 0;border-radius:12px;background:var(--red);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;}

</style>
</head>

function seededShuffle(arr, seed){
  const a=[...arr]; let s=seed;
  for(let i=a.length-1;i>0;i--){
    s=(Math.imul(s,1664525)+1013904223)>>>0;
    const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function todaysKing(){
  const now=new Date();
  const start=new Date(now.getFullYear(),0,1);
  const week=Math.floor((now-start)/(7*24*60*60*1000));
  const day=now.getDay();
  return seededShuffle(SNOW_KINGS, week)[day];
}

// ── STATE ─────────────────────────────────────────────────────────────────────
const state = {
  view: 'index',
  mode: null,
  step: 0,
  photos: [],
  mosaicUrl: null,
  downloaded: false,
};

function currentSteps(){ return state.mode==='daily' ? STEPS_D : STEPS_S; }
function totalSlots(){ return currentSteps().reduce((a,s)=>a+s.max,0); }
function filled(){ return state.photos.flat().filter(Boolean).length; }

function startMode(mode){
  state.mode = mode;
  state.step = 0;
  state.photos = currentSteps().map(s=>Array(s.max).fill(null));
  state.mosaicUrl = null;
  state.downloaded = false;
  state.view = 'form';
  render();
}

function goHome(){
  state.view = 'index';
  state.mode = null;
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');

  if(state.view==='index'){ renderIndex(app); return; }
  if(state.view==='generating'){ renderGenerating(app); return; }
  if(state.view==='mosaic'){ renderMosaic(app); return; }
  renderForm(app);
}

function renderIndex(app){
  const now = new Date();
  const dateStr = now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

  app.innerHTML=`<div class="index-view">
    <div class="index-header">
      <div class="index-store">${SN}</div>
      <div class="index-date">${cap(dateStr)}</div>
    </div>
    <div class="index-body">
      <div class="index-king"><img src="${todaysKing()}" alt="Snow King"></div>
      <div class="index-label">Selecione o tipo de inspeção</div>
      <button class="btn-index" onclick="startMode('daily')">
        Inspeção Diária<br>
        <span class="btn-index-sub">日清检查 · 11 itens · 15 fotos</span>
      </button>
      <button class="btn-index" onclick="startMode('weekly')">
        Inspeção Semanal<br>
        <span class="btn-index-sub">周清检查 · 41 itens · 70 fotos</span>
      </button>
    </div>
    <div class="index-footer">Mixue Ice Cream &amp; Tea Brasil</div>
  </div>`;
}

function renderGenerating(app){
  app.innerHTML=`<div class="gen-view">
    <div class="spinner"></div>
    <div class="gen-text">Gerando mosaico...</div>
  </div>`;
}

function renderMosaic(app){
  const label = state.mode==='daily' ? 'Inspeção Diária' : 'Inspeção Semanal';
  app.innerHTML=`<div class="mosaic-view">
    <div class="header">
      <button class="btn-back-header" onclick="safeGoHome()">← Início</button>
      <div><div class="header-title">${SN}</div><div class="header-sub">${label} — mosaico pronto</div></div>
      <div class="header-badge">✅</div>
    </div>
    <div class="mosaic-body">
      <img class="mosaic-img" src="${state.mosaicUrl}">
      <button class="btn-download-full" onclick="doDownload()">⬇ Baixar Mosaico</button>
      <button class="btn-reset-mosaic" onclick="safeNewInspection()">↺ Nova Inspeção</button>
      <button class="btn-home" onclick="safeGoHome()">⌂ Voltar ao Início</button>
    </div>
  </div>`;
}

function renderForm(app){
  const STEPS = currentSteps();
  const s = STEPS[state.step];
  const p = state.photos[state.step];
  const f = filled();
  const ts = totalSlots();
  const progress = state.step/(STEPS.length-1)*100;
  const label = state.mode==='daily' ? 'Inspeção Diária · 日清' : 'Inspeção Semanal · 周清';
  const isLast = state.step===STEPS.length-1;

  const dotsHtml = STEPS.map((st,i)=>{
    const taken=state.photos[i].filter(Boolean).length;
    const done=taken===st.max, partial=taken>0&&!done;
    let cls='dot';
    if(i===state.step) cls+=' active';
    else if(done) cls+=' done';
    else if(partial) cls+=' partial';
    return `<button class="${cls}" onclick="goStep(${i})">${done?'✓':partial?`${taken}/${st.max}`:st.n}</button>`;
  }).join('');

  let photoHtml='';
  if(s.max===1){
    const img=p[0];
    photoHtml=`<div class="photo-single${img?' has-photo':''}" onclick="openPicker(0)">
      ${img?`<img src="${img}"><div class="swap-btn">Trocar</div>`
           :`<div class="photo-empty"><div class="icon">📷</div><div class="lbl">Toque para tirar ou escolher foto</div></div>`}
    </div>`;
  } else {
    const gc=s.max===2?'g2':s.max===3?'g3':s.max===4?'g4':'g5';
    const slots=Array.from({length:s.max},function(_,slot){
      const img=p[slot];
      return '<div class="photo-slot'+(img?' has-photo':'')+'" onclick="openPicker('+slot+')">'
        +(img?'<img src="'+img+'"><div class="swap-btn">Trocar</div><div class="slot-num">'+(slot+1)+'</div>'
            :'<div class="photo-empty"><div class="icon">📷</div><div class="lbl">Foto '+(slot+1)+'</div><div class="sub">'+(slot===0?'obrigatória':'opcional')+'</div></div>')
        +'</div>';
    }).join('');
    photoHtml='<div class="photo-grid '+gc+'">'+slots+'</div>';
  }

  const pending = isLast&&f<ts ? `<div class="pending-note">${ts-f} foto(s) pendente(s) — pode gerar assim mesmo</div>` : '';

  app.innerHTML=`
    <div class="header">
      <button class="btn-back-header" onclick="safeGoHome()">← Início</button>
      <div><div class="header-title">${SN}</div><div class="header-sub">${label}</div></div>
      <div class="header-badge">${f}/${ts} 📷</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="step-counter">
      <span>Etapa <b>${state.step+1}</b> de ${STEPS.length}</span>
      <span>${f} foto${f!==1?'s':''} tirada${f!==1?'s':''}</span>
    </div>
    <div class="dots">${dotsHtml}</div>
    <div class="main">
      <div class="step-name">
        <div class="step-pt">${s.n}. ${s.pt}</div>
        <div class="step-zh">${s.zh}</div>
        ${s.max>1?`<div class="step-badge">até ${s.max} foto${s.max>1?'s':''}</div>`:''}
      </div>
      ${photoHtml}
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(event)">
      <div class="nav">
        <button class="btn-prev${state.step===0?' disabled':''}" onclick="goPrev()">←</button>
        <button class="btn-next" onclick="goNext()">${isLast?'✅ Gerar Mosaico':'Próximo →'}</button>
      </div>
      ${pending}
    </div>`;
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
let activeSlot=0;
function openPicker(slot){activeSlot=slot;document.getElementById('file-input').click();}
function handleFile(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{state.photos[state.step][activeSlot]=ev.target.result;e.target.value='';render();};
  reader.readAsDataURL(file);
}
function goStep(i){state.step=i;render();}
function goPrev(){if(state.step>0){state.step--;render();}}
function goNext(){
  if(state.step<currentSteps().length-1){state.step++;render();return;}
  state.view='generating';render();
  setTimeout(()=>buildMosaic().then(url=>{state.mosaicUrl=url;state.view='mosaic';render();}),50);
}

// ── MOSAIC ────────────────────────────────────────────────────────────────────
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function buildMosaic(){
  return new Promise(resolve=>{
    const STEPS = currentSteps();
    const isDaily = state.mode==='daily';

    // Build flat cell list
    const CELLS=[];
    STEPS.forEach((s,si)=>{
      for(let p=0;p<s.max;p++){
        CELLS.push({si,pi:p,
          labelPt:s.max>1?`${s.n}. ${s.pt} (${p+1}/${s.max})`:`${s.n}. ${s.pt}`,
          labelZh:s.max>1?`${s.zh} ${p+1}`:s.zh});
      }
    });

    const COLS = isDaily ? 4 : 4;
    const CW = isDaily ? 280 : 260;
    const CH = isDaily ? 370 : 340;
    const LH = isDaily ? 52 : 48;
    const GAP=5, HH=90, FH=52;
    const ROWS=Math.ceil(CELLS.length/COLS);
    const totalW=COLS*CW+(COLS+1)*GAP;
    const totalH=HH+ROWS*(CH+LH)+(ROWS+1)*GAP+FH;

    const canvas=document.createElement('canvas');
    canvas.width=totalW;canvas.height=totalH;
    const ctx=canvas.getContext('2d');

    ctx.fillStyle='#EFEFEF';ctx.fillRect(0,0,totalW,totalH);

    // Header
    ctx.fillStyle=RED;ctx.fillRect(0,0,totalW,HH);
    // Center titles (no store name here — redundant)
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`bold 22px Helvetica,Arial,sans-serif`;
    const titlePt = isDaily?'Inspeção Diária — Mixue Ice Cream & Tea':'Inspeção Semanal — Mixue Ice Cream & Tea';
    const titleZh = isDaily?'蜜雪冰城 · 日清检查':'蜜雪冰城 · 周清检查';
    ctx.fillText(titlePt,totalW/2,HH/2-11);
    ctx.font='13px Arial,sans-serif';ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.fillText(titleZh,totalW/2,HH/2+13);
    // Store name — top left, same font size as timestamp, vertically centered in header
    const snFontSize=Math.round(totalW*0.028);
    ctx.font=`bold ${snFontSize}px Helvetica,Arial,sans-serif`;
    ctx.fillStyle='rgba(255,255,255,0.90)';
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(SN,16,HH/2);

    Promise.all(CELLS.map(c=>{
      const src=state.photos[c.si][c.pi];
      if(!src)return Promise.resolve(null);
      return new Promise(r=>{const img=new Image();img.onload=()=>r(img);img.onerror=()=>r(null);img.src=src;});
    })).then(imgs=>{
      for(let i=0;i<CELLS.length;i++){
        const col=i%COLS,row=Math.floor(i/COLS);
        const x=GAP+col*(CW+GAP),y=HH+GAP+row*(CH+LH+GAP);
        if(imgs[i]){
          drawCover(ctx,imgs[i],x,y,CW,CH);
        }else{
          ctx.fillStyle='#d8d8d8';ctx.fillRect(x,y,CW,CH);
          ctx.fillStyle='#b0b0b0';ctx.font='40px Arial';
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('📷',x+CW/2,y+CH/2);
        }
        drawLabel(ctx,CELLS[i].labelPt,CELLS[i].labelZh,x,y+CH,CW,LH);
      }
      for(let i=CELLS.length;i<ROWS*COLS;i++){
        const col=i%COLS,row=Math.floor(i/COLS);
        ctx.fillStyle='#e4e4e4';
        ctx.fillRect(GAP+col*(CW+GAP),HH+GAP+row*(CH+LH+GAP),CW,CH+LH);
      }

      // Timestamp
      const now=new Date();
      const tsDate=now.getHours()<12?new Date(now.getTime()-86400000):now;
      const tsStr=tsDate.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
      const tsFontSize=Math.round(totalW*0.028);
      ctx.font=`bold ${tsFontSize}px Helvetica,Arial,sans-serif`;
      const tsW=ctx.measureText(tsStr).width;
      const tsPadX=18,tsPadY=10;
      const tsBoxW=tsW+tsPadX*2,tsBoxH=tsFontSize+tsPadY*2;
      ctx.fillStyle='rgba(0,0,0,0.58)';
      roundRect(ctx,totalW-tsBoxW-14,14,tsBoxW,tsBoxH,tsBoxH/2);ctx.fill();
      ctx.fillStyle='#FFFFFF';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(tsStr,totalW-tsBoxW/2-14,14+tsBoxH/2);

      // Footer
      const fy=totalH-FH;
      ctx.fillStyle='#e2e2e2';ctx.fillRect(0,fy,totalW,FH);
      ctx.fillStyle='#888';ctx.font='13px Arial';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(`${SN}  ·  Gerado em ${tsStr}  ·  ${filled()}/${totalSlots()} fotos`,totalW/2,fy+FH/2);
      resolve(canvas.toDataURL('image/jpeg',0.92));
    });
  });
}

function drawCover(ctx,img,x,y,w,h){
  if(!img)return;
  const scale=Math.max(w/img.width,h/img.height);
  const sw=w/scale,sh=h/scale;
  ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h);
}

function drawLabel(ctx,ptText,zhText,x,y,w,h){
  ctx.fillStyle=RED;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`bold ${Math.round(h*.34)}px Helvetica,Arial,sans-serif`;
  ctx.fillText(ptText,x+w/2,y+h*.33);
  ctx.font=`${Math.round(h*.20)}px Arial,sans-serif`;
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.fillText(zhText,x+w/2,y+h*.74);
}

function reportFilename(){
  const now=new Date();
  const d=now.getHours()<12?new Date(now.getTime()-86400000):now;
  const yyyy=d.getFullYear();
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const dd=String(d.getDate()).padStart(2,'0');
  const tipo=state.mode==='daily'?'D':'S';
  return `${tipo}-${yyyy}${mm}${dd}-${STORE_NAME}.jpg`;
}
function doDownload(){
  state.downloaded=true;
  const a=document.createElement('a');
  a.href=state.mosaicUrl;
  a.download=reportFilename();
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

async function doShare(){
  state.downloaded=true;
  if(!navigator.share){doDownload();return;}
  try{
    const res=await fetch(state.mosaicUrl);
    const blob=await res.blob();
    const file=new File([blob],reportFilename(),{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:`Inspeção ${tipo} · ${SN}`});
    }else doDownload();
  }catch(err){if(err.name!=='AbortError')doDownload();}
}

// ── MODAL ────────────────────────────────────────────────────────────────────
function showModal(msg, sub, onYes){
  const ov=document.createElement('div');
  ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-card">
    <div class="modal-icon">⚠️</div>
    <div class="modal-msg">${msg}</div>
    <div class="modal-sub">${sub}</div>
    <div class="modal-btns">
      <button class="modal-btn-no" id="modal-no">Não</button>
      <button class="modal-btn-yes" id="modal-yes">Sim</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#modal-no').onclick=()=>{document.body.removeChild(ov);};
  ov.querySelector('#modal-yes').onclick=()=>{document.body.removeChild(ov);onYes();};
}

// ── FOOLPROOF ────────────────────────────────────────────────────────────────
function needsConfirmation(){
  return state.view !== 'index' && filled() > 0 && !state.downloaded;
}
function safeGoHome(){
  if(needsConfirmation()){
    showModal('Tem certeza que deseja voltar?','Todas as fotos registradas serão perdidas.',goHome);
  } else goHome();
}
function safeNewInspection(){
  if(needsConfirmation()){
    showModal('Iniciar nova inspeção?','Todas as fotos registradas serão perdidas.',()=>startMode(state.mode));
  } else startMode(state.mode);
}

render();
</script>
